<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Russian Notebook</title>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#17181b;--card:#1d1f23;--border:#303238;--text:#e7e7e9;--muted:#92949c;--accent:#555b70;--accent-bg:#242733}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.app{max-width:900px;margin:48px auto;padding:0 22px}.tabs{display:flex;gap:6px;padding:0 0 14px;border-bottom:1px solid var(--border)}
button,input,textarea,select{font:inherit}.tab,.btn,.small{cursor:pointer;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--muted);padding:8px 13px}.tab.active{background:var(--accent-bg);color:var(--text);border-color:var(--border)}
.content{max-width:800px;margin:auto;padding:28px 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.title{font-size:21px;font-weight:600;letter-spacing:-.4px}.muted{color:var(--muted);font-size:12px}
.formarea{background:#141518;border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:18px}.formtitle{font-size:12px;font-weight:600;margin-bottom:12px}
label{display:block;font-size:11px;color:var(--muted);margin:0 0 6px}.field{width:100%;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);outline:none}.field:focus{border-color:#737b98}.field::placeholder{color:#73757d}
textarea{resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.btn{color:var(--text);font-size:12px}.primary{background:var(--accent);border-color:var(--accent);color:white}
.toolbar{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.toolbar .field:first-child{flex:1}.toolbar select{width:auto;min-width:150px}
.entry{padding:14px;border:1px solid var(--border);border-radius:7px;background:var(--card);margin-top:9px}.entryrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.entrymain{font-size:16px;line-height:1.6;overflow-wrap:anywhere}.sub{font-size:13px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}.entryactions{display:flex;gap:6px;flex-shrink:0}.small{font-size:12px;padding:5px 8px;color:var(--muted)}.small:hover,.btn:hover{border-color:#73757d;color:var(--text)}
.empty{text-align:center;padding:65px 10px;color:var(--muted);font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--border)}
button:disabled{opacity:.4;cursor:not-allowed}.btn:disabled:hover{border-color:var(--border);color:var(--text)}
@media(max-width:520px){.app{margin:20px auto;padding:0 14px}.content{padding-top:22px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.toolbar select{flex:1}}

.grammar-intro{font-size:12px;margin:0 0 18px}
.grammar-section{border:1px solid var(--border);background:#17181b;border-radius:8px;padding:17px;margin:12px 0}
.grammar-section h2{font-size:15px;font-weight:600;margin:0 0 10px}
.grammar-note{font-size:12px;line-height:1.7;color:var(--muted);margin:9px 0}
.grammar-note b{color:var(--text)}
.tablewrap{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:540px;text-align:left}
th,td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:500;background:#1d1f23}
td b{font-weight:600}
.example{padding:9px 11px;border-left:2px solid #626a83;background:#1d1f23;margin:7px 0;font-size:13px}
.example span{display:block;color:var(--muted);font-size:12px;margin-top:3px}

/* Flashcards */
.fc-overlay{position:fixed;inset:0;background:rgba(10,11,13,.96);z-index:50;display:flex;flex-direction:column;align-items:center;padding:20px 16px;overflow:auto}
.fc-overlay[hidden]{display:none}
.fc-bar{width:100%;max-width:720px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.fc-bar .fc-title{font-size:14px;font-weight:600}
.fc-bar .fc-controls{display:flex;gap:6px;flex-wrap:wrap}
.small.on{background:var(--accent-bg);color:var(--text);border-color:#737b98}
.fc-progress{width:100%;max-width:720px;height:3px;background:var(--border);border-radius:2px;margin-bottom:18px;overflow:hidden}
.fc-progress div{height:100%;background:#737b98;width:0;transition:width .2s}
.fc-stage{width:100%;max-width:720px;perspective:1400px;flex:0 0 auto}
.fc-card{position:relative;width:100%;height:340px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-card.noanim{transition:none}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 32px;text-align:center;overflow:auto}
.fc-back{transform:rotateY(180deg);background:#1a1c21}
.fc-main{font-size:28px;line-height:1.4;overflow-wrap:anywhere;max-width:100%}
.fc-main.long{font-size:20px}
.fc-sub{font-size:14px;color:var(--muted);margin-top:16px;overflow-wrap:anywhere;max-width:100%}
.fc-label{position:absolute;top:12px;left:16px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#73757d}
.fc-nav{display:flex;align-items:center;gap:18px;margin-top:20px}
.fc-nav .btn{min-width:90px}
.fc-count{font-size:13px;color:var(--muted);min-width:70px;text-align:center}
.fc-hint{margin-top:14px;font-size:11px;color:#73757d}
@media(max-width:520px){.fc-card{height:300px}.fc-main{font-size:23px}.fc-face{padding:22px 18px}}
</style>
</head>
<body>
<main class="app">
  <nav class="tabs" aria-label="Sections">
    <button class="tab active" data-tab="sentences">Sentences</button>
    <button class="tab" data-tab="dictionary">Dictionary</button>
  </nav>
  <section class="content">
    <header class="top"><div><div class="title" id="heading">Sentences</div><div class="muted" id="subheading">Your personal Russian sentence collection</div></div><div class="muted" id="total"></div></header>
    <section class="formarea" id="entry-form">
      <div class="formtitle" id="formtitle">Add a sentence</div>
      <div id="sentenceform">
        <div class="grid">
          <div class="full"><label for="sentence-ru">Russian</label><textarea id="sentence-ru" class="field" rows="2" placeholder="Введите предложение..."></textarea></div>
          <div class="full"><label for="sentence-en">Translation / meaning (optional)</label><textarea id="sentence-en" class="field" rows="2" placeholder="English translation..."></textarea></div>
          <div class="full"><label for="sentence-note">Notes (optional)</label><textarea id="sentence-note" class="field" rows="2" placeholder="Grammar, context, pronunciation..."></textarea></div>
        </div>
        <div class="actions"><button class="btn" id="clear-sentence">Clear</button><button class="btn primary" id="add-sentence">Add sentence</button></div>
      </div>
      <div id="dictionaryform" hidden>
        <div class="grid">
          <div><label for="word-ru">Russian word</label><input id="word-ru" class="field" placeholder="слово"></div>
          <div><label for="word-en">Meaning / translation</label><input id="word-en" class="field" placeholder="Meaning (optional)"></div>
          <div class="full"><label for="word-note">Notes (optional)</label><input id="word-note" class="field" placeholder="Gender, examples, reminders..."></div>
        </div>
        <div class="actions"><button class="btn" id="clear-word">Clear</button><button class="btn primary" id="add-word">Add word</button></div>
      </div>
    </section>
    <div class="toolbar" id="entry-toolbar"><input id="search" class="field" placeholder="Search sentences..."><select id="sort" class="field" aria-label="Sort entries"><option value="newest">Recently added</option><option value="oldest">Oldest first</option><option value="az">Russian A–Я</option><option value="za">Russian Я–А</option></select><button class="btn" id="flash-btn">Flashcards</button></div>
    <div id="entries"></div>
    <footer class="footer" id="entry-footer"><span class="muted">Stored in this browser</span><button class="small" id="export">Export data ↓</button></footer>
  </section>
</main>

<div class="fc-overlay" id="fc" hidden role="dialog" aria-modal="true" aria-label="Flashcards">
  <div class="fc-bar">
    <div class="fc-title" id="fc-title">Flashcards</div>
    <div class="fc-controls">
      <button class="small" id="fc-shuffle">Shuffle</button>
      <button class="small" id="fc-side">Russian first</button>
      <button class="small" id="fc-close">Close ✕</button>
    </div>
  </div>
  <div class="fc-progress"><div id="fc-bar-fill"></div></div>
  <div class="fc-stage">
    <div class="fc-card" id="fc-card">
      <div class="fc-face fc-front"><span class="fc-label" id="fc-front-label">Russian</span><div id="fc-front"></div></div>
      <div class="fc-face fc-back"><span class="fc-label" id="fc-back-label">English</span><div id="fc-back"></div></div>
    </div>
  </div>
  <div class="fc-nav">
    <button class="btn" id="fc-prev">← Prev</button>
    <span class="fc-count" id="fc-count"></span>
    <button class="btn" id="fc-next">Next →</button>
  </div>
  <div class="fc-hint">Click card or press Space to flip · ← → to move · Esc to close</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id),key='russian-notebook-data-v1';
let data={sentences:[],dictionary:[]},tab='sentences',editing=null;
try{const saved=JSON.parse(localStorage.getItem(key));if(saved){data.sentences=Array.isArray(saved.sentences)?saved.sentences:[];data.dictionary=Array.isArray(saved.dictionary)?saved.dictionary:[]}}catch(e){}
const save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){alert('Could not save data in this browser. Export a backup.')}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=()=>data[tab];
function clearForm(){['sentence-ru','sentence-en','sentence-note','word-ru','word-en','word-note'].forEach(id=>$(id).value='');editing=null;$('formtitle').textContent=tab==='sentences'?'Add a sentence':'Add a word';$('add-sentence').textContent='Add sentence';$('add-word').textContent='Add word'}
function switchTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('heading').textContent=t==='sentences'?'Sentences':'Dictionary';$('subheading').textContent=t==='sentences'?'Your personal Russian sentence collection':'Your personal Russian vocabulary';$('sentenceform').hidden=t!=='sentences';$('dictionaryform').hidden=t!=='dictionary';$('formtitle').textContent=t==='sentences'?'Add a sentence':'Add a word';$('search').placeholder=t==='sentences'?'Search sentences...':'Search words and meanings...';clearForm();render()}
function addOrUpdate(){let item;if(tab==='sentences'){const ru=$('sentence-ru').value.trim();if(!ru){$('sentence-ru').focus();return}item={ru,en:$('sentence-en').value.trim(),note:$('sentence-note').value.trim()}}else{const ru=$('word-ru').value.trim();if(!ru){$('word-ru').focus();return}item={ru,en:$('word-en').value.trim(),note:$('word-note').value.trim()}}if(editing!==null){const old=items().find(x=>x.id===editing);if(old)Object.assign(old,item)}else items().push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),created:Date.now(),...item});save();clearForm();render()}
$('add-sentence').onclick=addOrUpdate;$('add-word').onclick=addOrUpdate;
$('clear-sentence').onclick=()=>{clearForm();$('sentence-ru').focus()};$('clear-word').onclick=()=>{clearForm();$('word-ru').focus()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('search').oninput=render;$('sort').onchange=render;
function edit(id){const x=items().find(v=>v.id===id);if(!x)return;editing=id;$('formtitle').textContent='Edit entry';if(tab==='sentences'){$('sentence-ru').value=x.ru;$('sentence-en').value=x.en||'';$('sentence-note').value=x.note||'';$('add-sentence').textContent='Save changes';$('sentence-ru').focus()}else{$('word-ru').value=x.ru;$('word-en').value=x.en||'';$('word-note').value=x.note||'';$('add-word').textContent='Save changes';$('word-ru').focus()}document.querySelector('.formarea').scrollIntoView({behavior:'smooth',block:'nearest'})}
function remove(id){if(!confirm('Delete this entry?'))return;data[tab]=items().filter(x=>x.id!==id);save();render()}

/* Entries currently visible: respects the search box and sort order */
function filtered(){const q=$('search').value.trim().toLocaleLowerCase();const arr=items().filter(x=>[x.ru,x.en,x.note].some(s=>(s||'').toLocaleLowerCase().includes(q)));const sort=$('sort').value;arr.sort((a,b)=>sort==='newest'?(b.created||0)-(a.created||0):sort==='oldest'?(a.created||0)-(b.created||0):sort==='az'?a.ru.localeCompare(b.ru,'ru'):b.ru.localeCompare(a.ru,'ru'));return arr}

function render(){const q=$('search').value.trim();const arr=filtered();$('total').textContent=items().length+' total';
  const fb=$('flash-btn');fb.disabled=!arr.length;fb.textContent='Flashcards ('+arr.length+')';
  if(!arr.length){$('entries').innerHTML='<div class="empty">'+(q?'No matching entries.':'Nothing here yet. Add your first '+(tab==='sentences'?'sentence':'word')+' above.')+'</div>';return}
  $('entries').innerHTML=arr.map(x=>`<article class="entry"><div class="entryrow"><div style="min-width:0;flex:1"><div class="entrymain">${esc(x.ru).replace(/\n/g,'<br>')}</div>${x.en?`<div class="sub">${esc(x.en)}</div>`:''}${x.note?`<div class="sub" style="opacity:.7">${esc(x.note)}</div>`:''}</div><div class="entryactions"><button class="small" data-edit="${x.id}">Edit</button><button class="small" data-delete="${x.id}" aria-label="Delete entry">×</button></div></div></article>`).join('');
  $('entries').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('entries').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))}

$('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='russian-notebook-backup.json';a.click();URL.revokeObjectURL(url)};

/* ---------- Flashcards ---------- */
let deck=[],order=[],idx=0,flipped=false,reversed=false,shuffled=false;
const fcEl=$('fc'),card=$('fc-card');
const html=s=>esc(s).replace(/\n/g,'<br>');
const mainBlock=s=>`<div class="fc-main${s.length>60?' long':''}">${html(s)}</div>`;

function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function paint(){
  const x=order[idx];if(!x)return;
  const hasEn=!!x.en;
  const frontText=(reversed&&hasEn)?x.en:x.ru;
  const backMain=(reversed&&hasEn)?x.ru:(x.en||'');
  $('fc-front-label').textContent=(reversed&&hasEn)?'English':'Russian';
  $('fc-back-label').textContent=(reversed&&hasEn)?'Russian':(hasEn?'English':'Notes');
  $('fc-front').innerHTML=mainBlock(frontText);
  let back='';
  if(backMain)back+=mainBlock(backMain);
  if(x.note)back+=`<div class="fc-sub">${html(x.note)}</div>`;
  if(!backMain&&!x.note)back='<div class="fc-sub">(no translation or notes)</div>';
  $('fc-back').innerHTML=back;
  $('fc-count').textContent=(idx+1)+' / '+order.length;
  $('fc-bar-fill').style.width=((idx+1)/order.length*100)+'%';
  $('fc-prev').disabled=idx===0;$('fc-next').disabled=idx===order.length-1;
}
function setFlipped(v){flipped=v;card.classList.toggle('flipped',v)}
function show(i){
  idx=Math.max(0,Math.min(order.length-1,i));
  // reset to front with no animation so the answer never flashes during a card change
  card.classList.add('noanim');setFlipped(false);void card.offsetWidth;paint();
  requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove('noanim')));
}
function openCards(){
  deck=filtered();if(!deck.length)return;
  const q=$('search').value.trim();
  $('fc-title').textContent=(tab==='sentences'?'Sentence':'Dictionary')+' flashcards'+(q?' · filtered: “'+q+'”':'');
  shuffled=false;$('fc-shuffle').classList.remove('on');
  order=deck.slice();
  fcEl.hidden=false;document.body.style.overflow='hidden';
  show(0);
}
function closeCards(){fcEl.hidden=true;document.body.style.overflow=''}
$('flash-btn').onclick=openCards;
$('fc-close').onclick=closeCards;
card.onclick=()=>setFlipped(!flipped);
$('fc-prev').onclick=()=>show(idx-1);
$('fc-next').onclick=()=>show(idx+1);
$('fc-shuffle').onclick=()=>{shuffled=!shuffled;$('fc-shuffle').classList.toggle('on',shuffled);order=shuffled?shuffleArr(deck):deck.slice();show(0)};
$('fc-side').onclick=()=>{reversed=!reversed;$('fc-side').textContent=reversed?'English first':'Russian first';$('fc-side').classList.toggle('on',reversed);show(idx)};
document.addEventListener('keydown',e=>{
  if(fcEl.hidden)return;
  if(e.key==='Escape'){closeCards()}
  else if(e.key==='ArrowRight'){e.preventDefault();show(idx+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();show(idx-1)}
  else if(e.key===' '||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(document.activeElement&&document.activeElement.tagName==='BUTTON'&&(e.key===' '||e.key==='Enter'))return;
    e.preventDefault();setFlipped(!flipped)}
});

render();
})();
</script>
</body>
</html>
